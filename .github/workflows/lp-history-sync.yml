# Sync open + closed LP event history for WATCH_WALLETS (incremental closed).
name: LP history sync

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync LP history
        env:
          WATCH_WALLETS: ${{ secrets.WATCH_WALLETS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUI_RPC_URL: ${{ secrets.VITE_SUI_RPC_URL }}
          VITE_COINGECKO_API_KEY: ${{ secrets.VITE_COINGECKO_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          VITE_LP_LIFECYCLE_INDEXER: "1"
          LP_HIST_QUOTE_CONCURRENCY: "3"
        run: npm run lp-history:sync -w sui-lp-tracker
