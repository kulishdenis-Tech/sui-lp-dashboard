# Heavy worker for portfolio snapshots (Node has enough time; Vercel Hobby does not).
# Primary trigger: Supabase pg_cron → /api/cron/dispatch-portfolio-snapshot → workflow_dispatch
# Backup: hourly schedule (GitHub schedule alone is best-effort and often delayed/dropped).
name: Portfolio snapshot

on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass 90m dedupe (FORCE_SNAPSHOT=1)"
        type: boolean
        default: true

concurrency:
  group: portfolio-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run portfolio snapshot
        id: snap
        continue-on-error: true
        env:
          WATCH_WALLETS: ${{ secrets.WATCH_WALLETS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUI_RPC_URL: ${{ secrets.VITE_SUI_RPC_URL }}
          VITE_COINGECKO_API_KEY: ${{ secrets.VITE_COINGECKO_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          FORCE_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force && '1' || '' }}
        run: npm run snapshot:once -w sui-lp-tracker

      - name: Retry snapshot
        if: steps.snap.outcome == 'failure'
        env:
          WATCH_WALLETS: ${{ secrets.WATCH_WALLETS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUI_RPC_URL: ${{ secrets.VITE_SUI_RPC_URL }}
          VITE_COINGECKO_API_KEY: ${{ secrets.VITE_COINGECKO_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          FORCE_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force && '1' || '' }}
        run: |
          sleep 20
          npm run snapshot:once -w sui-lp-tracker
