services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    command: ['npm', 'run', 'bot']
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - '${DASHBOARD_PORT:-5190}:5190'
    command: ['npm', 'run', 'dashboard', '--', '--host', '0.0.0.0']
    depends_on:
      - bot
